name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://1294-test-page.robot-armies.com  # Change this with the current production link
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_STRIPE_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_BUY_BUTTON_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_CAMP_CAD_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_CAMP_CAD_BUY_BUTTON_ID }}
          VITE_STRIPE_CAMP_PROGRAMMING_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_CAMP_PROGRAMMING_BUY_BUTTON_ID }}
          VITE_STRIPE_CAMP_ENGINEERING1_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_CAMP_ENGINEERING1_BUY_BUTTON_ID }}
          VITE_STRIPE_CAMP_ENGINEERING2_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_CAMP_ENGINEERING2_BUY_BUTTON_ID }}
          VITE_STRIPE_ADDON_WL_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_ADDON_WL_BUY_BUTTON_ID }}

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          source: "dist/*"
          target: "/var/www/html/"

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo systemctl restart nginx