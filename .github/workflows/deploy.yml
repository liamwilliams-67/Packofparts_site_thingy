name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://1294-test-page.robot-armies.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_URL: ""
          VITE_STRIPE_BUY_BUTTON_ID: ${{ secrets.VITE_STRIPE_BUY_BUTTON_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PAYMENT_LINK: ${{ secrets.VITE_STRIPE_PAYMENT_LINK }}
          VITE_STRIPE_CAMP_CAD_PRICE_ID: ${{ secrets.VITE_STRIPE_CAMP_CAD_PRICE_ID }}
          VITE_STRIPE_CAMP_PROGRAMMING_PRICE_ID: ${{ secrets.VITE_STRIPE_CAMP_PROGRAMMING_PRICE_ID }}
          VITE_STRIPE_CAMP_ENGINEERING1_PRICE_ID: ${{ secrets.VITE_STRIPE_CAMP_ENGINEERING1_PRICE_ID }}
          VITE_STRIPE_CAMP_ENGINEERING2_PRICE_ID: ${{ secrets.VITE_STRIPE_CAMP_ENGINEERING2_PRICE_ID }}
          VITE_STRIPE_ADDON_WL_PRICE_ID: ${{ secrets.VITE_STRIPE_ADDON_WL_PRICE_ID }}

      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          source: "dist/*"
          target: "/var/www/html/"

      - name: Copy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          source: "server/*"
          target: "/home/ubuntu/backend/"

      - name: Copy nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          source: "nginx/site.conf"
          target: "/home/ubuntu/"

      - name: Configure backend, nginx & restart services
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cat > /home/ubuntu/backend/server/.env <<EOF
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            CLIENT_URL=https://1294-test-page.robot-armies.com
            PORT=3001
            STRIPE_CAMP_CAD_PRICE_ID=${{ secrets.STRIPE_CAMP_CAD_PRICE_ID }}
            STRIPE_CAMP_PROGRAMMING_PRICE_ID=${{ secrets.STRIPE_CAMP_PROGRAMMING_PRICE_ID }}
            STRIPE_CAMP_ENGINEERING1_PRICE_ID=${{ secrets.STRIPE_CAMP_ENGINEERING1_PRICE_ID }}
            STRIPE_CAMP_ENGINEERING2_PRICE_ID=${{ secrets.STRIPE_CAMP_ENGINEERING2_PRICE_ID }}
            STRIPE_ADDON_WL_PRICE_ID=${{ secrets.STRIPE_ADDON_WL_PRICE_ID }}
            EOF

            cd /home/ubuntu/backend/server
            npm install --production

            pm2 restart backend || pm2 start /home/ubuntu/backend/server/index.js --name backend
            pm2 save

            # Deploy nginx config and reload
            sudo cp /home/ubuntu/nginx/site.conf /etc/nginx/sites-available/default
            sudo nginx -t && sudo systemctl reload nginx
