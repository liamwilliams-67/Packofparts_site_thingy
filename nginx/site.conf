# ── Production Nginx configuration for Pack of Parts ──
# Deployed automatically by .github/workflows/deploy.yml
# Manual changes on the server will be overwritten on next deploy.

# Suppress Nginx version in headers and error pages
server_tokens off;

# 1. Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 1294-test-page.robot-armies.com;
    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 1294-test-page.robot-armies.com;

    root /var/www/html/dist;
    index index.html;

    # SSL Config (Certbot)
    ssl_certificate /etc/letsencrypt/live/1294-test-page.robot-armies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1294-test-page.robot-armies.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy
    # Allows: self, Stripe JS, Mapbox GL JS + tiles, inline styles
    # NOTE: 'unsafe-inline' in style-src is required by Mapbox GL JS which injects
    #        inline styles for map rendering. Nonce-based CSP is not supported by
    #        Mapbox GL at this time. Remove if Mapbox is replaced with a CSP-friendly lib.
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' https://js.stripe.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com; img-src 'self' data: blob: https://*.mapbox.com https://*.stripe.com; connect-src 'self' https://api.stripe.com https://*.mapbox.com https://events.mapbox.com; frame-src https://js.stripe.com; worker-src blob:; font-src 'self';"
      always;

    # SECURITY: Block dotfiles (.env, .git, etc.) but allow .well-known (Certbot)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # PROXY: The checkout session
    location /create-checkout-session {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PROXY: General API
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FRONTEND: SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
