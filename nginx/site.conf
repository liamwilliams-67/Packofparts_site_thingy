# ── Production Nginx configuration for Pack of Parts ──
# Copy to /etc/nginx/sites-available/packofparts and symlink to sites-enabled.
# Adjust paths, domain name, and SSL certificate paths as needed.

# Suppress Nginx version in headers and error pages
server_tokens off;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name 1294-test-page.robot-armies.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 1294-test-page.robot-armies.com;

    # ── SSL (adjust paths to your certificate files) ──
    ssl_certificate     /etc/letsencrypt/live/1294-test-page.robot-armies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1294-test-page.robot-armies.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy
    # Allows: self, Stripe JS, Mapbox GL JS + tiles, inline styles
    # NOTE: 'unsafe-inline' in style-src is required by Mapbox GL JS which injects
    #        inline styles for map rendering. Nonce-based CSP is not supported by
    #        Mapbox GL at this time. Remove if Mapbox is replaced with a CSP-friendly lib.
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' https://js.stripe.com https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com; img-src 'self' data: blob: https://*.mapbox.com https://*.stripe.com; connect-src 'self' https://api.stripe.com https://*.mapbox.com https://events.mapbox.com; frame-src https://js.stripe.com; worker-src blob:; font-src 'self';"
      always;

    # ── Frontend static files ──
    root /var/www/html/dist;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── Proxy to Node.js backend ──
    location /create-checkout-session {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block dotfiles (.env, .git, etc.) ──
    location ~ /\. {
        deny all;
        return 404;
    }
}
