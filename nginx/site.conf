# ── Production Nginx configuration for Pack of Parts ──
# Deployed automatically by .github/workflows/deploy.yml
# Manual changes on the server will be overwritten on next deploy.

# Suppress Nginx version in headers and error pages
server_tokens off;

# ── DDoS / rate-limit zones (http context) ──
# 10 MB shared memory each; keyed by hashed binary client IP.
# "general" zone: 20 requests/second for normal page traffic.
# "api" zone: 5 requests/second for backend API endpoints.
limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Return 429 Too Many Requests (instead of default 503) when limits are hit.
limit_req_status  429;
limit_conn_status 429;

# ── Bad-bot / scanner User-Agent blocking ──
# Map known malicious tools to $bad_bot = 1 so the server block can drop them.
map $http_user_agent $bad_bot {
    default                                     0;
    ~*(?:nikto|sqlmap|masscan|nmap|nessus)      1;
    ~*(?:openvas|dirbuster|hydra|medusa)        1;
    ~*(?:metasploit|havij|acunetix|w3af)        1;
    ~*(?:nuclei|zgrab|libwww-perl|lwp-trivial)  1;
    ~*(?:zmeu|morfeus|harvest|extract|grab)     1;
}

# 1. Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 1294-test-page.robot-armies.com;
    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 1294-test-page.robot-armies.com;

    root /var/www/html/dist;
    index index.html;

    # SSL Config (Certbot)
    ssl_certificate /etc/letsencrypt/live/1294-test-page.robot-armies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1294-test-page.robot-armies.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Slowloris / slow-read attack mitigation ──
    # Drop clients that stop sending headers or body mid-request.
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      30s;
    send_timeout           10s;
    # Body size is generous for our form payloads (field limits sum to ~1.5 KB);
    # 64 KB gives headroom while still preventing bulk-upload abuse.
    client_max_body_size        64k;
    # 2 x 8 KB covers typical browsers with large cookies / auth headers.
    large_client_header_buffers 2 8k;

    # ── Bot / scanner blocking ──
    # Drop connections from known malicious User-Agents (mapped above).
    # Using 'if' in the server context (not inside a location block) is safe
    # for simple unconditional returns and is the standard nginx pattern for
    # server-wide UA filtering.  444 closes the socket with no response.
    if ($bad_bot) {
        return 444;
    }

    # ── HTTP method restriction ──
    # Only allow the methods this site actually needs; silently drop the rest.
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 444;
    }

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy
    # Allows: self, Stripe JS, Mapbox GL JS + tiles, inline styles, and others
    # NOTE: 'unsafe-inline' in style-src is required by Mapbox GL JS which injects
    #        inline styles for map rendering. Nonce-based CSP is not supported by
    #        Mapbox GL at this time. Remove if Mapbox is replaced with a CSP-friendly lib.
    # report-uri: Logs CSP violations for monitoring (note: browsers will log to console)
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' https://js.stripe.com https://api.mapbox.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com https://fonts.googleapis.com; img-src 'self' data: blob: https://*.mapbox.com https://*.stripe.com https://i.ytimg.com; connect-src 'self' https://api.stripe.com https://*.mapbox.com https://events.mapbox.com; frame-src https://js.stripe.com https://www.youtube.com https://www.youtube-nocookie.com https://calendar.google.com; worker-src blob:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; report-uri /csp-violation-report;"
      always;

    # SECURITY: Block dotfiles (.env, .git, etc.) but allow .well-known (Certbot)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # PROXY: The checkout session (strict API rate limit; POST only)
    location /create-checkout-session {
        # nodelay: burst requests pass through immediately rather than queueing,
        # which prevents connection pile-up under DDoS while still enforcing the
        # long-term rate once the burst allowance is exhausted.
        limit_req  zone=api burst=5 nodelay;
        limit_conn addr 5;
        limit_except POST { deny all; }

        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PROXY: CSP violation reporting (POST only)
    location /csp-violation-report {
        limit_req  zone=api burst=10 nodelay;
        limit_conn addr 5;
        limit_except POST { deny all; }

        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PROXY: General API
    location /api/ {
        limit_req  zone=api burst=10 nodelay;
        limit_conn addr 10;

        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FRONTEND: SPA Routing
    location / {
        limit_req  zone=general burst=30 nodelay;
        limit_conn addr 20;

        try_files $uri $uri/ /index.html;
    }
}